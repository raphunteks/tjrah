# Konfigurasi minimal Supabase CLI. Jalankan `supabase link --project-ref <ref>` sebelum `supabase db push`.
project_id = "harum-in"

# Dipanggil oleh cron/webhook dengan header rahasia sendiri (bukan JWT pengguna).
